  <style>
    html {
      box-sizing: border-box;
    }

    *, *:before, *:after {
      box-sizing: inherit;
    }

    body {
      position: fixed;
      height: 100%;
      font-family: 'Source Sans Pro', Arial, sans-serif;
      font-size: 1rem; /* 16px */
      /* Background is owned by the Skyroom theme (see public/stylesheets/skyroom/theme.css).
         A neutral fallback prevents a white flash before that stylesheet loads. */
      background-color: #070B14;
    }

    /* Persian font is loaded from public/stylesheets/skyroom/iranyekan.css */

    :-webkit-full-screen {
      background-color: inherit;
    }

    a {
      color: inherit;
    }

    #app {
      height: 100%;
      width: 100vw;
      overflow: hidden;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }

    .set-z-index {
      z-index: 15;
      width: 100% !important;
      height: 100% !important;
    }

    .remove-z-index {
      z-index: 0;
    }
    /* .full-screen {
      height: 100% !important;
      width: 100% !important;
      transform: translateX(0) translateY(0) translateZ(0) !important;
    } */

    [hidden]:not([hidden="false"]) {
      display: none !important;
    }

    ::-webkit-input-placeholder {
      color: var(--palette-placeholder-text);
      opacity: 1;
    }

    :-moz-placeholder, /* Firefox 4 to 18 */
    ::-moz-placeholder { /* Firefox 19+ */
      color: var(--palette-placeholder-text);
      opacity: 1;
    }

    main {
      display: initial;
    }

    .overrideSelect {
      background-color: #FFF !important;
      color: #000 !important;
    }

    .select {
      background-color: rgba(66, 133, 244, 1) !important;
      color: #FFF !important;
    }

    .fade-in {
      opacity: 1 !important;
    }

    .fade-out {
      opacity: 0 !important;
    }
  </style>

  <script>
    /* Skyroom: dark-only theme before React paints */
    document.documentElement.setAttribute('data-theme', 'dark');
    document.documentElement.setAttribute('data-skyroom', 'true');
    document.documentElement.setAttribute('dir', 'rtl');
    document.documentElement.setAttribute('lang', 'fa');
    document.addEventListener('DOMContentLoaded', function () {
      if (document.body) document.body.classList.add('lang-fa');
    });
    try { window.localStorage.setItem('skyroom-theme', 'dark'); } catch (e) {}

    /* Phones: attempt native portrait lock early. Tablets/desktop unchanged. */
    (function lockSkyroomPhonePortrait() {
      var ua = navigator.userAgent || '';
      var isPhone = /iPhone|Android.+Mobile|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua);
      var isIpadDesktopUa = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
      var isTablet = isIpadDesktopUa || /iPad|Tablet|Nexus 7|Nexus 10|SM-T/i.test(ua);
      var shortSide = Math.min(screen.width || 0, screen.height || 0);
      if (!isPhone || isTablet || shortSide >= 600) return;
      try {
        if (screen.orientation && typeof screen.orientation.lock === 'function') {
          screen.orientation.lock('portrait').catch(function () {});
        }
      } catch (e) {}
    })();

    /* Optional per-server palette override written by bbb-install-safemeet
       to /var/www/bigbluebutton-default/assets/safemeet/theme-override.css
       and served at /safemeet/theme-override.css. Missing file = default theme. */
    (function loadSafemeetThemeOverride() {
      var href = '/safemeet/theme-override.css';
      var apply = function () {
        if (document.querySelector('link[data-safemeet-theme-override]')) return;
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        link.setAttribute('data-safemeet-theme-override', 'true');
        link.crossOrigin = 'anonymous';
        document.head.appendChild(link);
      };
      if (typeof fetch !== 'function') {
        apply();
        return;
      }
      fetch(href, { method: 'HEAD', cache: 'no-cache', credentials: 'same-origin' })
        .then(function (res) { if (res && res.ok) apply(); })
        .catch(function () { /* keep packaged SafeMeet default */ });
    })();
  </script>

  <main>
    <div id="app" role="document">
      <script>
        (function () {
          var ua = navigator.userAgent;
          var isSafari = /^((?!chrome|android).)*safari/i.test(ua);

          var MIN_VERSIONS = {
            safari: 14,
            chrome: 87,
            firefox: 80,
            edge: 85,
            miui: 0
          };

          function parseVersion(regex) {
            var match = ua.match(regex);
            return match ? parseInt(match[1], 10) : null;
          }

          var safariVersion = parseVersion(/Version\/(\d+).*Safari/);
          var chromeVersion = parseVersion(/(?:Chrome|CriOS)\/(\d+)/);
          var firefoxVersion = parseVersion(/Firefox\/(\d+)/);
          var edgeVersion = parseVersion(/Edg\/(\d+)/);
          var miuiVersion = parseVersion(/MiuiBrowser\/(\d+)/);

          var tooOld =
            (isSafari && safariVersion && safariVersion < MIN_VERSIONS.safari) ||
            (chromeVersion && chromeVersion < MIN_VERSIONS.chrome) ||
            (firefoxVersion && firefoxVersion < MIN_VERSIONS.firefox) ||
            (edgeVersion && edgeVersion < MIN_VERSIONS.edge)||
            (miuiVersion !== null);

          if (tooOld) {
            var banner = document.createElement('div');
            banner.innerHTML = '<strong>Browser not supported</strong><br>Please update your browser or contact support service.';
            banner.style.cssText = 'background:#ffdddd;color:#a00;padding:1em;margin:1em 0;text-align:center;font-family:sans-serif;';
            document.body.insertBefore(banner, document.body.firstChild);
          } else {
            var bundleHash = '<%= bundleHash %>';
            var isProduction = '<%= isProduction %>' === 'true';
            var script = document.createElement('script');

            if (isProduction && isSafari && safariVersion && safariVersion < 16 && safariVersion >= MIN_VERSIONS.safari) {
              document.documentElement.classList.add('legacy');
              script.src = 'bundle.' + bundleHash + '.safari.js';
            } else {
              script.src = 'bundle.' + bundleHash + '.js';
            }

            document.head.appendChild(script);
          }

          
        })();
      </script>
  </main>
