name: SafeMeet CI/CD

on:
  push:
    branches: [safemeet]
  pull_request:
    branches: [safemeet]
  workflow_dispatch:
    inputs:
      force_full_publish:
        description: Build and publish the full SafeMeet BBB package set
        required: false
        default: false
        type: boolean

concurrency:
  group: safemeet-ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Patch-bump SafeMeet product version on every push to safemeet (0.8 → 0.8.1 → …).
  # Milestones (0.9, 1.0, …) are set manually via scripts/safemeet-bump-version.sh --set
  bump-version:
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/safemeet' &&
      !contains(github.event.head_commit.message, '[skip version]') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    name: Bump SafeMeet version
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: bump
        run: |
          set -euo pipefail
          NEW_VERSION="$(bash scripts/safemeet-bump-version.sh --bump)"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "SafeMeet version → ${NEW_VERSION}"

      - name: Commit and push version bump
        run: |
          set -euo pipefail
          VERSION="$(bash scripts/safemeet-bump-version.sh --get)"
          git config user.name "safemeet-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SAFEMEET_VERSION \
            bigbluebutton-html5/private/config/settings.yml \
            bigbluebutton-html5/imports/ui/core/initial-values/meetingClientSettings.ts
          if git diff --cached --quiet; then
            echo "Version files unchanged; nothing to commit"
            exit 0
          fi
          # Keep the message on one indented line: a zero-indent heredoc breaks YAML `|` blocks.
          git commit -m "chore(version): bump SafeMeet to ${VERSION} [skip version] [skip ci]"
          git push origin HEAD:safemeet

  changes:
    needs: [bump-version]
    if: always() && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped')
    runs-on: ubuntu-latest
    name: Detect changed areas
    outputs:
      html5: ${{ steps.paths.outputs.html5 }}
      recording: ${{ steps.paths.outputs.recording }}
      shell: ${{ steps.paths.outputs.shell }}
      fsesl: ${{ steps.paths.outputs.fsesl }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: paths
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" || -z "$BEFORE" ]]; then
            FILES="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git show --name-only --pretty=format: HEAD)"
          else
            FILES="$(git diff --name-only "$BEFORE" "$AFTER")"
          fi
          echo "Changed files in this push:"
          echo "$FILES"
          has() { grep -qE "$1" <<< "$FILES"; }
          if has '^bigbluebutton-html5/' || has '^SAFEMEET_VERSION$'; then echo "html5=true" >> "$GITHUB_OUTPUT"; else echo "html5=false" >> "$GITHUB_OUTPUT"; fi
          if has '^(record-and-playback/|bbb-common-web/.*/RecordingAsset|bigbluebutton-web/grails-app/(controllers/org/bigbluebutton/web/controllers/RecordingController\.groovy|controllers/org/bigbluebutton/web/UrlMappings\.groovy|conf/))'; then
            echo "recording=true" >> "$GITHUB_OUTPUT"
          else
            echo "recording=false" >> "$GITHUB_OUTPUT"
          fi
          if has '^(scripts/|bbb-install-safemeet-3\.0\.sh$|deploy\.sh$|deploy\.rsync-excludes$|\.github/workflows/safemeet-ci-cd\.yml$)'; then echo "shell=true" >> "$GITHUB_OUTPUT"; else echo "shell=false" >> "$GITHUB_OUTPUT"; fi
          if has '^(akka-bbb-fsesl/|bbb-fsesl-client/)'; then echo "fsesl=true" >> "$GITHUB_OUTPUT"; else echo "fsesl=false" >> "$GITHUB_OUTPUT"; fi

  shellcheck:
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    name: ShellCheck
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './scripts'
          additional_files: 'bbb-install-safemeet-3.0.sh deploy.sh'
          severity: error

  html5-checks:
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.html5 == 'true'
    runs-on: ubuntu-latest
    name: HTML5 lint & typecheck
    defaults:
      run:
        working-directory: bigbluebutton-html5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bigbluebutton-html5/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint . --ext .ts,.tsx --max-warnings 0
        continue-on-error: true

      - name: Typecheck
        run: npm run tscheck:staged

  safemeet-recording-specs:
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.recording == 'true'
    runs-on: ubuntu-latest
    name: SafeMeet recording specs
    defaults:
      run:
        working-directory: record-and-playback/core
    steps:
      - uses: actions/checkout@v4

      - name: Install systemd headers (journald-native)
        run: sudo apt-get update && sudo apt-get install -y libsystemd-dev

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
          working-directory: record-and-playback/core

      - name: Install gems (with test group)
        run: |
          bundle config set --local with 'test'
          bundle install --jobs 4 --retry 3

      - name: Run RSpec
        run: bundle exec rspec spec/recordandplayback/safemeet_asset_spec.rb

  publish-packages:
    needs: [bump-version, changes, shellcheck, html5-checks, safemeet-recording-specs]
    if: |
      always() &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.force_full_publish)
      ) &&
      github.ref == 'refs/heads/safemeet' &&
      (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped') &&
      needs.changes.result == 'success' &&
      (needs.shellcheck.result == 'success' || needs.shellcheck.result == 'skipped') &&
      (needs.html5-checks.result == 'success' || needs.html5-checks.result == 'skipped') &&
      (needs.safemeet-recording-specs.result == 'success' || needs.safemeet-recording-specs.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tip of safemeet includes the version-bump commit from bump-version
          ref: safemeet
          fetch-depth: 0

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SAFEMEET_BBB_REPO_SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Add repository server to known_hosts
        env:
          REPO_HOST: ${{ secrets.SAFEMEET_BBB_REPO_HOST || '78.157.39.4' }}
          REPO_PORT: ${{ secrets.SAFEMEET_BBB_REPO_PORT || '3698' }}
        run: bash scripts/safemeet-wait-repo-ssh.sh

      - name: Plan package publish
        id: package_plan
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          REPO_DOMAIN: new-bbb-install.roomeet.ir
          SAFEMEET_FORCE_FULL_PACKAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.force_full_publish }}
        run: |
          set -euo pipefail
          BASELINE=""
          EXISTING_REPO_PACKAGES="$(
            curl -fsSL "https://${REPO_DOMAIN}/jammy-300/dists/bigbluebutton-jammy/main/binary-amd64/Packages.gz" \
              | gzip -dc \
              | grep -c '^Package:' || true
          )"

          pick_oldest_baseline() {
            local head="$1"
            shift
            local commit oldest=""
            for commit in "$@"; do
              [[ -n "$commit" ]] || continue
              git cat-file -e "${commit}^{commit}" 2>/dev/null || continue
              git merge-base --is-ancestor "$commit" "$head" || continue
              if [[ -z "$oldest" ]] || git merge-base --is-ancestor "$commit" "$oldest"; then
                oldest="$commit"
              fi
            done
            printf '%s' "$oldest"
          }

          BASELINE_CANDIDATES=()
          if [[ "${EXISTING_REPO_PACKAGES:-0}" == "0" ]]; then
            git fetch --no-tags origin v3.0.x-release
            BASELINE="$(git merge-base HEAD origin/v3.0.x-release)"
            echo "SafeMeet repo is empty; initial package baseline: ${BASELINE}"
          else
            if [[ -n "${GITHUB_EVENT_BEFORE:-}" && "$GITHUB_EVENT_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
              BASELINE_CANDIDATES+=("$GITHUB_EVENT_BEFORE")
            fi
            PUBLISHED_BASELINE="$(bash scripts/safemeet-repo-published-baseline.sh HEAD || true)"
            if [[ -n "${PUBLISHED_BASELINE:-}" ]]; then
              BASELINE_CANDIDATES+=("$PUBLISHED_BASELINE")
              echo "Latest published package baseline: ${PUBLISHED_BASELINE}"
            fi
            BASELINE="$(pick_oldest_baseline HEAD "${BASELINE_CANDIDATES[@]}")"
            if [[ -n "$BASELINE" ]]; then
              echo "Package diff baseline: ${BASELINE}"
            fi
          fi
          if [[ -n "$BASELINE" ]]; then
            git fetch --no-tags --depth=1 origin "$BASELINE" 2>/dev/null || git fetch --no-tags origin "$BASELINE" 2>/dev/null || true
          fi
          if [[ "${SAFEMEET_FORCE_FULL_PACKAGES:-}" == "true" ]]; then
            PACKAGES="$(bash scripts/safemeet-detect-packages.sh 2>/dev/null || true)"
          else
            PACKAGES="$(bash scripts/safemeet-detect-packages.sh "$BASELINE" HEAD 2>/dev/null || true)"
          fi
          if [[ -z "${PACKAGES// }" ]]; then
            echo "mode=installer-only" >> "$GITHUB_OUTPUT"
            echo "packages=" >> "$GITHUB_OUTPUT"
            echo "Package publish plan: installer/config assets only"
          else
            COMPACT="$(echo "$PACKAGES" | tr '\n' ' ' | sed 's/  */ /g;s/^ //;s/ $//')"
            {
              echo "mode=packages"
              echo "packages=${COMPACT}"
            } >> "$GITHUB_OUTPUT"
            echo "Package publish plan: ${COMPACT}"
          fi

      - name: Get external build dependencies
        if: steps.package_plan.outputs.packages != ''
        run: build/get_external_dependencies.sh

      - name: Pre-pull BBB build Docker image
        if: steps.package_plan.outputs.packages != ''
        run: |
          set -euo pipefail
          DOCKER_IMAGE="$(
            python3 -c 'import yaml; print(yaml.load(open("./.gitlab-ci.yml"), Loader=yaml.SafeLoader)["default"]["image"])'
          )"
          echo "Pre-pulling ${DOCKER_IMAGE}"
          retry_wait=30
          for attempt in 1 2 3 4 5 6 7 8; do
            if docker pull "$DOCKER_IMAGE"; then
              echo "Docker image ready after attempt ${attempt}"
              exit 0
            fi
            echo "docker pull attempt ${attempt} failed"
            if [[ "$attempt" -lt 8 ]]; then
              echo "Waiting ${retry_wait}s before retry..."
              sleep "$retry_wait"
              retry_wait=$((retry_wait * 2))
              if [[ "$retry_wait" -gt 180 ]]; then
                retry_wait=180
              fi
            fi
          done
          if docker image inspect "$DOCKER_IMAGE" >/dev/null 2>&1; then
            echo "Pull failed, continuing with locally available image"
            exit 0
          fi
          echo "Unable to pull or locate BBB build image" >&2
          exit 1

      - name: Build selected Debian packages
        if: steps.package_plan.outputs.packages != ''
        env:
          PACKAGE_LIST: ${{ steps.package_plan.outputs.packages }}
          FORCE_GIT_REV: safemeet.${{ github.sha }}
          FORCE_COMMIT_DATE: ${{ github.run_id }}
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts

          for package in $PACKAGE_LIST; do
            echo "::group::Build ${package}"
            build/setup.sh "$package"
            echo "::endgroup::"
          done

          test -n "$(ls -A artifacts 2>/dev/null)"

      - name: Publish installer and packages to repo server
        env:
          REPO_HOST: ${{ secrets.SAFEMEET_BBB_REPO_HOST || '78.157.39.4' }}
          REPO_PORT: ${{ secrets.SAFEMEET_BBB_REPO_PORT || '3698' }}
          REPO_USER: ${{ secrets.SAFEMEET_BBB_REPO_USER || 'root' }}
          REPO_DOMAIN: new-bbb-install.roomeet.ir
        run: scripts/safemeet-publish-packages.sh --debs "artifacts/*.deb"

      - name: Publish summary
        run: |
          echo "### BigBlueButton package publish" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SafeMeet version: \`$(tr -d '[:space:]' < SAFEMEET_VERSION 2>/dev/null || echo n/a)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: ${{ steps.package_plan.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Packages: ${{ steps.package_plan.outputs.packages || 'none; installer only' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: https://new-bbb-install.roomeet.ir/jammy-300" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> CI no longer pushes source code to the old BBB server or runs BBB deploy scripts there." >> "$GITHUB_STEP_SUMMARY"

  auto-repair:
    name: CI Auto-Repair
    needs: [bump-version, changes, shellcheck, html5-checks, safemeet-recording-specs, publish-packages]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/safemeet' &&
      (
        needs.bump-version.result == 'failure' ||
        needs.changes.result == 'failure' ||
        needs.shellcheck.result == 'failure' ||
        needs.html5-checks.result == 'failure' ||
        needs.safemeet-recording-specs.result == 'failure' ||
        needs.publish-packages.result == 'failure'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      PROJECT_NAME: bigbluebutton
      PRODUCTION_BRANCH: safemeet
      REPO_URL: https://github.com/AlirezaMalekii/bigbluebutton
    steps:
      - name: Checkout (scripts only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/ci-auto-repair.sh
          sparse-checkout-cone-mode: false

      - name: Run auto-repair
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ci-auto-repair.sh
