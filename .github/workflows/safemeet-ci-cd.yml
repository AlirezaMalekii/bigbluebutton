name: SafeMeet CI/CD

on:
  push:
    branches: [safemeet]
  pull_request:
    branches: [safemeet]
  workflow_dispatch:

concurrency:
  group: safemeet-ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    name: Detect changed areas
    outputs:
      html5: ${{ steps.paths.outputs.html5 }}
      recording: ${{ steps.paths.outputs.recording }}
      shell: ${{ steps.paths.outputs.shell }}
      fsesl: ${{ steps.paths.outputs.fsesl }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: paths
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" || -z "$BEFORE" ]]; then
            FILES="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git show --name-only --pretty=format: HEAD)"
          else
            FILES="$(git diff --name-only "$BEFORE" "$AFTER")"
          fi
          echo "Changed files in this push:"
          echo "$FILES"
          has() { grep -qE "$1" <<< "$FILES"; }
          if has '^bigbluebutton-html5/'; then echo "html5=true" >> "$GITHUB_OUTPUT"; else echo "html5=false" >> "$GITHUB_OUTPUT"; fi
          if has '^(record-and-playback/|bbb-common-web/.*/RecordingAsset|bigbluebutton-web/grails-app/(controllers/org/bigbluebutton/web/controllers/RecordingController\.groovy|controllers/org/bigbluebutton/web/UrlMappings\.groovy|conf/))'; then
            echo "recording=true" >> "$GITHUB_OUTPUT"
          else
            echo "recording=false" >> "$GITHUB_OUTPUT"
          fi
          if has '^(scripts/|deploy\.sh|deploy\.rsync-excludes)'; then echo "shell=true" >> "$GITHUB_OUTPUT"; else echo "shell=false" >> "$GITHUB_OUTPUT"; fi
          if has '^(akka-bbb-fsesl/|bbb-fsesl-client/)'; then echo "fsesl=true" >> "$GITHUB_OUTPUT"; else echo "fsesl=false" >> "$GITHUB_OUTPUT"; fi

  shellcheck:
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    name: ShellCheck
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './scripts'
          severity: error

  html5-checks:
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.html5 == 'true'
    runs-on: ubuntu-latest
    name: HTML5 lint & typecheck
    defaults:
      run:
        working-directory: bigbluebutton-html5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bigbluebutton-html5/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint . --ext .ts,.tsx --max-warnings 0
        continue-on-error: true

      - name: Typecheck
        run: npm run tscheck:staged

  safemeet-recording-specs:
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.recording == 'true'
    runs-on: ubuntu-latest
    name: SafeMeet recording specs
    defaults:
      run:
        working-directory: record-and-playback/core
    steps:
      - uses: actions/checkout@v4

      - name: Install systemd headers (journald-native)
        run: sudo apt-get update && sudo apt-get install -y libsystemd-dev

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
          working-directory: record-and-playback/core

      - name: Install gems (with test group)
        run: |
          bundle config set --local with 'test'
          bundle install --jobs 4 --retry 3

      - name: Run RSpec
        run: bundle exec rspec spec/recordandplayback/safemeet_asset_spec.rb

  deploy:
    needs: [changes, shellcheck, html5-checks, safemeet-recording-specs]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/safemeet' &&
      needs.changes.result == 'success' &&
      (needs.shellcheck.result == 'success' || needs.shellcheck.result == 'skipped') &&
      (needs.html5-checks.result == 'success' || needs.html5-checks.result == 'skipped') &&
      (needs.safemeet-recording-specs.result == 'success' || needs.safemeet-recording-specs.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Plan deploy
        id: deploy_plan
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_DIR: ${{ secrets.DEPLOY_REMOTE_DIR }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          LAST="$(ssh -p "$DEPLOY_PORT" -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" "cat '${REMOTE_DIR}/.deploy-state' 2>/dev/null" | head -1 | tr -d '[:space:]' || true)"
          BASELINE="$LAST"
          if [[ -z "$BASELINE" && -n "${GITHUB_EVENT_BEFORE:-}" && "$GITHUB_EVENT_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            BASELINE="$GITHUB_EVENT_BEFORE"
          fi
          if [[ -n "$BASELINE" ]]; then
            git fetch --no-tags --depth=1 origin "$BASELINE" 2>/dev/null || git fetch --no-tags origin "$BASELINE" 2>/dev/null || true
          fi
          PLAN="$(bash scripts/deploy-detect-components.sh "$BASELINE" HEAD 2>/dev/null || true)"
          echo "DEPLOY_BASELINE_COMMIT=${BASELINE}" >> "$GITHUB_ENV"
          if [[ "$PLAN" == "full" ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "Deploy plan: **full** (first deploy or deploy scripts changed)"
          elif [[ -z "${PLAN// }" ]]; then
            echo "mode=rsync-only" >> "$GITHUB_OUTPUT"
            echo "Deploy plan: **rsync only** (no component changes)"
          else
            COMPACT="$(echo "$PLAN" | tr '\n' ' ' | sed 's/  */ /g;s/^ //;s/ $//')"
            echo "mode=smart" >> "$GITHUB_OUTPUT"
            echo "components=${COMPACT}" >> "$GITHUB_OUTPUT"
            echo "CI_DEPLOY_COMPONENTS=${COMPACT}" >> "$GITHUB_ENV"
            echo "Deploy plan: **smart** → ${COMPACT}"
          fi

      - name: Deploy to BBB server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_DIR: ${{ secrets.DEPLOY_REMOTE_DIR }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          DEPLOY_SKIP_AKKA_FSESL: ${{ needs.changes.outputs.fsesl != 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "${DEPLOY_SKIP_AKKA_FSESL}" == "1" ]]; then
            ARGS+=(--skip-akka-fsesl)
          fi
          MODE="${{ steps.deploy_plan.outputs.mode }}"
          COMPONENTS="${{ steps.deploy_plan.outputs.components }}"
          case "$MODE" in
            rsync-only)
              ./deploy.sh "${ARGS[@]}"
              ;;
            smart)
              if [[ "$COMPONENTS" != *" "* ]]; then
                ./deploy.sh "${ARGS[@]}" --only "$COMPONENTS"
              else
                ./deploy.sh "${ARGS[@]}"
              fi
              ;;
            full|*)
              ./deploy.sh "${ARGS[@]}"
              ;;
          esac

      - name: Deploy summary
        run: |
          echo "### BigBlueButton deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: ${{ steps.deploy_plan.outputs.mode }}${{ steps.deploy_plan.outputs.components && format(' → {0}', steps.deploy_plan.outputs.components) || '' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Server: BBB (${{ secrets.DEPLOY_HOST }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> After recording indexer changes, re-index affected recordings manually on the server." >> "$GITHUB_STEP_SUMMARY"

  auto-repair:
    name: CI Auto-Repair
    needs: [changes, shellcheck, html5-checks, safemeet-recording-specs, deploy]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/safemeet' &&
      (
        needs.changes.result == 'failure' ||
        needs.shellcheck.result == 'failure' ||
        needs.html5-checks.result == 'failure' ||
        needs.safemeet-recording-specs.result == 'failure' ||
        needs.deploy.result == 'failure'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      PROJECT_NAME: bigbluebutton
      PRODUCTION_BRANCH: safemeet
      REPO_URL: https://github.com/AlirezaMalekii/bigbluebutton
    steps:
      - name: Checkout (scripts only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts/ci-auto-repair.sh
          sparse-checkout-cone-mode: false

      - name: Run auto-repair
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ci-auto-repair.sh
