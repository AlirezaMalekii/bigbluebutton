name: CI Auto-Repair

on:
  workflow_run:
    workflows: [SafeMeet CI/CD]
    types: [completed]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: ci-auto-repair-${{ github.repository }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'safemeet'
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: bigbluebutton
      PRODUCTION_BRANCH: safemeet
      REPO_URL: https://github.com/AlirezaMalekii/bigbluebutton
      WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
      WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Checkout (scripts only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: |
            .github/scripts/ci-auto-repair.sh
          sparse-checkout-cone-mode: false

      - name: Run auto-repair
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ci-auto-repair.sh
