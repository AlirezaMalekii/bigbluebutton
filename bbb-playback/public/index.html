<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark" data-skyroom="true">

    <link rel="icon" href="%PUBLIC_URL%/safemeet-logo.svg" type="image/svg+xml" />
    <link href="%PUBLIC_URL%/styles/video-js.min.css" rel="stylesheet" />
    <link href="%PUBLIC_URL%/styles/videojs-seek-buttons.css" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070B14" />

    />

    <title>سیف میت — پخش ضبط</title>

      document.documentElement.setAttribute('data-theme', 'dark');

      document.addEventListener('DOMContentLoaded', function () {
